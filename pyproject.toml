[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runpup"
dynamic = ["version"]
description = "A local catalog for completed machine-learning training runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.gui-scripts]
runpup = "runpup.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "runpup.__version__"}

[tool.setuptools.package-data]
runpup = ["assets/branding/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
